<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b101a">
  <meta name="description" content="Vida NFC reúne el catálogo, los contactos y la ubicación de Tractodo Diesel Parts.">
  <title>Vida NFC | Tractodo Diesel Parts</title>
  <link rel="preload" href="fondo-tractodo.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="styles.css?v=8">
  <style>
    .hero-brands {
      --brand-logo-height: clamp(2.5rem, 11vw, 3.6rem);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(.55rem, 2.2vw, 1rem);
      width: min(100%, 22rem);
    }
    .brand-badge {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      height: clamp(4.25rem, 15vw, 5.25rem);
      min-width: 0;
      margin: 0;
      padding: .45rem;
      border: 1px solid #354767;
      border-radius: .8rem;
    }
    .brand-badge--tractodo {
      background: #101725;
      color: #f7f9ff;
      font: 800 clamp(.75rem, 3.2vw, 1.25rem)/1 'Barlow Condensed', Impact, sans-serif;
      letter-spacing: .04em;
    }
    .brand-badge--tractodo small {
      display: block;
      margin-top: .2rem;
      color: #b0c8ea;
      font: 600 clamp(.43rem, 1.4vw, .57rem)/1 'DM Sans', sans-serif;
      letter-spacing: .15em;
    }
    .brand-badge img {
      box-sizing: border-box;
      display: block;
      width: auto;
      height: var(--brand-logo-height);
      max-width: 100%;
      object-fit: contain;
    }
    .brand-tractodo-logo {
      flex: none;
      aspect-ratio: 1;
      border: 1px solid #5bbdff;
      border-radius: 50%;
    }
    .brand-badge--vida { background: #fff; border-color: #fff; }
  </style>
  <script src="botones.js" defer></script>
</head>
<body class="home-page">
  <main>
    <header class="hero">
      <div class="hero-brands">
        <div class="brand-badge brand-badge--tractodo">
          <img class="brand-tractodo-logo" src="tractodo-logo.webp" alt="" width="44" height="44">
          <span>TRACTODO <small>DIESEL PARTS</small></span>
        </div>
        <h1 class="brand-badge brand-badge--vida">
          <img class="brand-vida-logo" src="vida-nfc.png" alt="Vida NFC. Tu información vital, a un toque de distancia." width="96" height="67">
        </h1>
      </div>
    </header>
    <nav class="actions" aria-label="Catálogo, contacto y redes">
      <a class="tile catalog" href="catalogo-tractodo.pdf" type="application/pdf">
        <span class="icon" aria-hidden="true"><i class="document"></i></span><span><strong>Catálogo de productos</strong><small>Abrir PDF</small></span><b aria-hidden="true">→</b>
      </a>
      <a class="tile whatsapp" href="whatsapp.html">
        <span class="icon"><img src="whatsapp.png" alt="" width="22" height="22"></span><span><strong>WhatsApp</strong><small>Cotiza con nuestro equipo</small></span><b aria-hidden="true">→</b>
      </a>
      <a class="tile social facebook" href="https://www.facebook.com/profile.php?id=100070995052516" target="_blank" rel="noopener noreferrer">
        <span class="icon social-f" aria-hidden="true">f</span><span><strong>Facebook</strong></span><b aria-hidden="true">↗</b>
      </a>
      <a class="tile social instagram" href="https://www.instagram.com/tractodo.diesel.parts/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><i class="camera"></i></span><span><strong>Instagram</strong></span><b aria-hidden="true">↗</b>
      </a>
      <a class="tile social tiktok" href="https://www.tiktok.com/@tractodo4" target="_blank" rel="noopener noreferrer">
        <span class="icon"><img src="tiktok.png" alt="" width="22" height="22"></span><span><strong>TikTok</strong></span><b aria-hidden="true">↗</b>
      </a>
    </nav>
    <section id="ubicacion" class="location-section" aria-labelledby="location-title">
      <header class="location-details">
        <div>
          <h2 class="location-title" id="location-title">Ubicación</h2>
          <address class="location-address">
            Río Extoraz, San Cayetano<br>
            76806 San Juan del Río, Qro.
          </address>
        </div>
        <a class="tile location map-directions" href="https://www.google.com/maps/dir/?api=1&amp;destination=20.3868559%2C-99.9814262&amp;destination_place_id=ChIJ01TDkZ0M04URt5hjlOpO-P0" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true"><i class="pin"></i></span><span><strong>Cómo llegar</strong><small>Abrir en Google Maps</small></span><b aria-hidden="true">↗</b>
        </a>
      </header>
      <iframe class="location-map" title="Mapa de Refacciones Diesel Tractodo en San Juan del Río" src="https://www.google.com/maps/embed?origin=mfe&amp;pb=!1m3!3m2!1m1!4s18300463855238879415!3m1!1ses!5m1!1ses" loading="lazy" referrerpolicy="no-referrer" allowfullscreen></iframe>
    </section>
  </main>
</body>
</html>
